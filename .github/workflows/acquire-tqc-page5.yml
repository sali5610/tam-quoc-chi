name: Add primary illustrations from scan 5
on:
  push:
    branches: [visual/inline-multisource]
    paths: ['.github/workflows/acquire-tqc-page5.yml']
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/inline-multisource
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Preserve verified scan and exact narrative mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          from io import BytesIO
          out=Path('src/story-art-assets/sl-0005-luu-bi-doc-buu.webp')
          if not out.exists():
              url='https://images.sourcelibrary.org/pages/6992f3d6dc69844b023ff3d1/0005.jpg'
              with urlopen(Request(url,headers={'User-Agent':'TamQuocChiPersonalReader/1.0'}),timeout=15) as res:
                  data=res.read(20*1024*1024+1)
              if len(data)>20*1024*1024: raise ValueError('scan exceeds limit')
              with Image.open(BytesIO(data)) as im:
                  if im.width<700 or im.height<500: raise ValueError('unexpected image dimensions')
                  im.thumbnail((1800,1800))
                  im.convert('RGB').save(out,'WEBP',quality=88)
          with Image.open(out) as im: im.verify()
          manifest=Path('src/story-art.json')
          rows=json.loads(manifest.read_text())
          row=dict(episode='ep-0002',anchor='tiểu thuyết trao màn nổi nóng cho Trương Phi'.capitalize(),file='sl-0005-luu-bi-doc-buu',caption='Lưu Bị lập công và Trương Phi đánh Đốc bưu — hai tranh nguyên trang, hồi 1–2',kind='Minh họa diễn nghĩa',placement='paragraph',source='https://sourcelibrary.org/zh/book/sanguo-zhi-tuxiang-illustrated-romance-of-the-three-kingdoms/page/6992f3d7dc69844b023ff3d6')
          row['anchor']='Tiểu thuyết trao màn nổi nóng cho Trương Phi'
          episode=Path('content/episodes/EP-0002_KHĂN_VÀNG_184.md').read_text()
          assert episode.count(row['anchor'])==1
          if not any(r['file']==row['file'] for r in rows):
              rows.append(row)
              manifest.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/validate-content.mjs && npx tsc --noEmit && npx vite build
      - name: Commit validated asset and mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/story-art-assets/sl-0005-luu-bi-doc-buu.webp src/story-art.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bundle primary scan 5 and validated story mapping"
          git push origin HEAD:refs/heads/visual/inline-multisource
