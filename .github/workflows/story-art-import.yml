name: Import story illustrations
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/story-art.json'
      - 'scripts/import-story-art.py'
      - '.github/workflows/story-art-import.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/import-story-art.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: story-art
          path: public/story-art/
