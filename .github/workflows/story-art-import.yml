name: Import story illustrations
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: story-art-import
  cancel-in-progress: false
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'import-story-art'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - uses: actions/cache/restore@v4
        with:
          path: public/story-art/
          key: story-art-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: story-art-${{ runner.os }}-
      - run: python scripts/import-story-art.py
        timeout-minutes: 2
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: public/story-art/
          key: story-art-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-art
          path: public/story-art/
          if-no-files-found: warn
          retention-days: 7
