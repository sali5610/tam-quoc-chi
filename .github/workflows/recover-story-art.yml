name: Recover previously downloaded story art
on:
  push:
    branches: [visual/inline-multisource]
    paths: ['.github/workflows/recover-story-art.yml']
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/inline-multisource
      - uses: actions/download-artifact@v4
        with:
          name: story-art
          run-id: 45306238444
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recovered-art
      - name: Validate and preserve four known assets
        env:
          RECOVERED: ${{ runner.temp }}/recovered-art
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, json, shutil
          src = Path(os.environ['RECOVERED'])
          out = Path('src/story-art-assets')
          out.mkdir(exist_ok=True)
          expected = [
              'Late Eastern Han pottery castle.JPG',
              'Zhang Jue Qing portrait.jpg',
              'Dong Zhuo Qing Dynasty Illustration.jpg',
              'Dong Zhuo plots to depose Emperor Shao of Han.jpg',
          ]
          manifest = {r['file'] for r in json.loads(Path('src/story-art.json').read_text())}
          for name in expected:
              assert name in manifest, name
              matches = list(src.rglob(name + '.webp'))
              assert len(matches) == 1, (name, matches)
              data = matches[0].read_bytes()
              assert len(data) > 16 and data[:4] == b'RIFF' and data[8:12] == b'WEBP', name
              shutil.copyfile(matches[0], out / (name + '.webp'))
              print('Recovered', name)
          PY
      - name: Commit only recovered illustrations to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/story-art-assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve four previously downloaded story illustrations"
          git push origin HEAD:refs/heads/visual/inline-multisource
