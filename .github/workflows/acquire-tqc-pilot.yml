name: Acquire primary TQC illustrations pilot
on:
  push:
    branches: [visual/inline-multisource]
    paths: ['.github/workflows/acquire-tqc-pilot.yml']
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/inline-multisource
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Download two identified primary scans and crop three illustrations
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          from io import BytesIO
          base = 'https://images.sourcelibrary.org/pages/6992f3d6dc69844b023ff3d1/'
          out = Path('src/story-art-assets')
          out.mkdir(exist_ok=True)
          # Fractions based on visually checked scan frames; traditional right-to-left order.
          crops = {
              '0004.jpg': [('sl-0004-peach-oath', (.028,.175,.459,.914))],
              '0006.jpg': [('sl-0006-he-jin', (.535,.18,.978,.91)), ('sl-0006-dong-zhuo', (.028,.153,.47,.918))],
          }
          for page, entries in crops.items():
              with urlopen(Request(base+page, headers={'User-Agent':'TamQuocChiPersonalReader/1.0'}),timeout=15) as response:
                  data = response.read(20*1024*1024+1)
              if len(data)>20*1024*1024:
                  raise ValueError('scan too large')
              with Image.open(BytesIO(data)) as im:
                  w,h=im.size
                  if not (w>=700 and h>=500 and 1.1<w/h<1.5):
                      raise ValueError(f'unexpected scan geometry {w}x{h}')
                  for name,box in entries:
                      crop=im.crop(tuple(round(v*(w if i%2==0 else h)) for i,v in enumerate(box))).convert('RGB')
                      crop.thumbnail((1200,1600))
                      target=out/(name+'.webp')
                      crop.save(target,'WEBP',quality=90)
                      with Image.open(target) as check: check.verify()
                      print('Saved', target)
          PY
      - name: Commit primary art only to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/story-art-assets/sl-0004-peach-oath.webp src/story-art-assets/sl-0006-he-jin.webp src/story-art-assets/sl-0006-dong-zhuo.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bundle three primary Tam Quoc Chi Do Tuong illustrations"
          git push origin HEAD:refs/heads/visual/inline-multisource
