name: Import reviewed TQC artwork batch
on:
  push:
    branches:
      - 'visual/**'
    paths:
      - 'content/art/tqc-import-queue.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tqc-art-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import:
    if: startsWith(github.ref, 'refs/heads/visual/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Import reviewed queue
        id: acquire
        run: python scripts/import-tqc-batch.py
        timeout-minutes: 2
      - name: Persist valid files even on partial failure
        if: always() && steps.acquire.outcome != 'skipped' && steps.acquire.outcome != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/story-art-assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bundle verified primary story artwork"
          git push origin "HEAD:$GITHUB_REF"
