name: Publish isolated React preview
# Release: atlas pilot QA after sparse role type fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/react-preview.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('dist/atlas/atlas.json'));if(d.license!=='CC-BY-SA-4.0'||d.version!==2||d.regions.length!==80||!d.events.length)throw Error('Atlas validation failed')"
          rm -rf docs/react-preview
          mkdir -p docs/react-preview
          cp -a dist/. docs/react-preview/
      - name: Browser smoke test before deployment
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory . > /tmp/atlas-server.log 2>&1 &
          mkdir -p tam-quoc-chi
          ln -s ../docs/react-preview tam-quoc-chi/react-preview
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            page.on('pageerror',e=>console.error(e));
            page.on('console',m=>{if(m.type()==='error')console.error(m.text())});
            for(const [id,name] of [['ep-0001','Hán Linh Đế'],['ep-0002','Hoàng Phủ Tung'],['ep-0003','Đổng Trác']]){
              await page.goto('http://localhost:4173/tam-quoc-chi/react-preview/#/read/'+id);
              const marker=page.locator('.atlas-person-marker').filter({hasText:name});
              await marker.waitFor({state:'visible',timeout:15000});
              await marker.scrollIntoViewIfNeeded();
              await page.locator('.strategy-board').scrollIntoViewIfNeeded();
              const ok=await marker.evaluate(el=>{const r=el.getBoundingClientRect(),b=el.closest('.strategy-board').getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;return x>b.left&&x<b.right&&y>b.top&&y<b.bottom&&el.contains(document.elementFromPoint(x,y))});
              if(!ok)throw Error('Marker clipped or obscured: '+name);
              if(id!=='ep-0001')await marker.locator('.atlas-local-relation svg').waitFor({state:'visible'});
              await marker.click();
              await page.getByRole('dialog',{name:'Chi tiết sự kiện'}).waitFor({state:'visible'});
              await page.getByRole('button',{name:'Đóng sự kiện'}).click();
              console.log('PASS visible character and relation: '+name);
            }
          } finally {await browser.close()}
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
