name: Publish Tam Quốc Chí
# Release: DEC-UX-036 — v6 becomes the single canonical production site at repository root
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/react-preview.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install image build dependency
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends imagemagick
          fi
          convert -version
      - run: npm run build
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('dist/atlas/atlas.json'));if(d.license!=='CC-BY-SA-4.0'||d.version!==2||d.regions.length!==80||!d.events.length)throw Error('Atlas validation failed')"
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import {resolveAtlasPlace} from './src/atlas-location.ts';
          const pilot=JSON.parse(fs.readFileSync('content/atlas/pilot.json','utf8'));
          const atlas=JSON.parse(fs.readFileSync('dist/atlas/atlas.json','utf8'));
          for(const year of [168,184,189,190,191,192]){
            const events=pilot.events.filter(e=>Number(e.year)===year&&e.episode<'ep-0007');
            if(events.length!==1)throw Error('Unexpected pilot event count for '+year);
            for(const e of events){
              const p=pilot.places.find(p=>p.id===e.place);
              const city=resolveAtlasPlace(atlas,p);
              if(!city||!Array.isArray(city.p)||!city.p.every(Number.isFinite))throw Error('Unresolved pilot coordinates '+e.id);
              for(const id of e.people)if(!pilot.people.some(p=>p.id===id)||!e.roles[id])throw Error('Missing person or role '+id);
              console.log('PASS input',e.id,city.name,city.p,city.precision,e.people);
            }
          }
          const resolution=JSON.parse(fs.readFileSync('evidence/BATCH_03_ATLAS_RESOLUTION.json','utf8'));
          for(const p of resolution.places){const loc=resolveAtlasPlace(atlas,pilot.places.find(x=>x.id===p.id));if(p.display==='site'||p.display==='region'){if(loc?.precision!==p.display||!loc.p.every(Number.isFinite))throw Error('B03 resolver mismatch '+p.id);}else if(loc)throw Error('Invented location '+p.id);}
          for(const e of pilot.events.filter(e=>e.episode>='ep-0007'&&e.episode<'ep-0010')){const loc=resolveAtlasPlace(atlas,pilot.places.find(x=>x.id===e.place));if(!loc||!loc.p.every(Number.isFinite))throw Error('Unresolved B03 event '+e.id);}
          console.log('PASS B03 45 place precision and 17 event anchors');
          const b04=JSON.parse(fs.readFileSync('evidence/BATCH_04_ATLAS_RESOLUTION.json','utf8'));
          for(const p of b04.places){const loc=resolveAtlasPlace(atlas,pilot.places.find(x=>x.id===p.id));const expected=p.id==='henei'?'region':p.display;if(expected==='site'||expected==='region'){if(loc?.precision!==expected||!loc.p.every(Number.isFinite))throw Error('B04 resolver mismatch '+p.id);}else if(loc)throw Error('Invented B04 location '+p.id);}
          for(const e of pilot.events.filter(e=>e.episode>='ep-0010'&&e.people.length)){const loc=resolveAtlasPlace(atlas,pilot.places.find(x=>x.id===e.place));if(!loc||!loc.p.every(Number.isFinite))throw Error('Unresolved B04 pin '+e.id);}
          console.log('PASS B04 place resolution and marker anchors');
          const registry=JSON.parse(fs.readFileSync('content/atlas/portraits.json','utf8'));
          const enabled=registry.portraits.filter(p=>p.enabled);
          if(enabled.length!==8||new Set(enabled.map(p=>p.id)).size!==enabled.length)throw Error('Unexpected portrait coverage');
          for(const p of enabled){if(!pilot.people.some(x=>x.id===p.id)||!fs.existsSync('dist/'+p.path))throw Error('Missing portrait '+p.id);}
          if(pilot.trajectories.filter(t=>t.episode<'ep-0010').length!==3||pilot.trajectories.length!==6)throw Error('Missing pilot journeys');
          for(const t of pilot.trajectories){
            if(!pilot.people.some(p=>p.id===t.person))throw Error('Unknown journey person '+t.id);
            for(const s of t.stops){const place=pilot.places.find(p=>p.id===s.place);if(!place||!s.evidence||!s.sourceUrl||!Number.isInteger(s.order))throw Error('Invalid journey stop '+s.place);const loc=resolveAtlasPlace(atlas,place);console.log('JOURNEY',t.id,s.order,s.place,loc?.precision||'unresolved');}
          }
          const html=fs.readFileSync('dist/index.html','utf8');
          const asset=html.match(/src="([^"]+\.js)"/)?.[1];
          if(!asset)throw Error('Missing built asset');
          const bundle=fs.readFileSync('dist/'+asset.replace(/^\.\//,''),'utf8');
          if(!bundle.includes('Atlas characters')||!bundle.includes('atlas-journey-select'))throw Error('Built asset missing character or journey renderer');
          JS
          printf '%s\n' "$GITHUB_SHA" > dist/release-sha.txt
          test ! -e dist/react-preview
          test -f dist/index.html
          test -f dist/atlas/atlas.json
      - name: Browser smoke test before deployment
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit
          mkdir -p "$RUNNER_TEMP/tqc-pages"
          ln -s "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/tqc-pages/tam-quoc-chi"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/tqc-pages" > /tmp/atlas-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 --max-time 5 http://localhost:4173/tam-quoc-chi/ >/dev/null
          node scripts/navigation-ia-smoke.mjs
          node scripts/atlas-ia-smoke.mjs
          node scripts/wiki-ia-smoke.mjs
          node scripts/ia-integration-smoke.mjs
          node scripts/ia-scale-smoke.mjs
          node scripts/browser-smoke.mjs
          node scripts/batch-03-atlas-smoke.mjs
          mkdir -p qa-v6
          TQC_TEST_BASE=http://localhost:4173/tam-quoc-chi/ node scripts/episode-visual-smoke.mjs
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/tam-quoc-chi/react-preview/index.html)" = 404
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public SHA
        run: |
          BASE=https://sali5610.github.io/tam-quoc-chi/
          for attempt in $(seq 1 18); do
            actual=$(curl -fsSL --max-time 10 "${BASE}release-sha.txt?sha=${GITHUB_SHA}&attempt=${attempt}" || true)
            if [ "$actual" = "$GITHUB_SHA" ]; then
              echo "PASS public SHA $actual"
              code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "${BASE}react-preview/index.html?sha=${GITHUB_SHA}")
              test "$code" = 404 || { echo "FAIL old preview still accessible: $code"; exit 1; }
              echo "PASS retired preview path"
              exit 0
            fi
            sleep 5
          done
          echo "FAIL public release SHA: $actual"; exit 1
      - name: Live Chromium and WebKit smoke
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          import fs from 'node:fs';
          const arts=JSON.parse(fs.readFileSync('content/scene-art.json','utf8'));
          const visuals=JSON.parse(fs.readFileSync('content/episode-visuals.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('content/manifest.json','utf8'));
          const episodes=manifest.eras.flatMap(e=>e.arcs.flatMap(a=>a.chapters.flatMap(c=>c.episodes)));
          const base='https://sali5610.github.io/tam-quoc-chi/?release='+process.env.GITHUB_SHA;
          for(const engine of [chromium,webkit]){
            const browser=await engine.launch();
            try{
              for(const [width,height] of [[390,844],[834,1194],[1194,834]]){
                const page=await browser.newPage({viewport:{width,height},hasTouch:true,reducedMotion:'reduce'});
                const errors=[];page.on('pageerror',e=>errors.push(String(e)));
                await page.goto(base+'#/');await page.locator('.home-hero').waitFor();
                for(const route of ['/library',...episodes.map(e=>'/read/'+e.id),'/people','/atlas/184','/atlas/190','/atlas/191','/atlas/192','/atlas/193','/atlas/194','/atlas/195','/atlas/196','/atlas/197','/atlas/198','/atlas/199','/atlas/200','/collection']){
                  await page.goto(base+'&route='+encodeURIComponent(route)+'#'+route);await page.locator('main h1').first().waitFor();
                  if(route.startsWith('/read')){
                    const episode=episodes.find(e=>e.id===route.split('/').pop());
                    await page.locator('.reader-hero h1').filter({hasText:episode.title}).waitFor();
                    const ids=visuals.filter(v=>v.episode===episode.id).map(v=>v.id);
                    await page.waitForFunction(ids=>JSON.stringify(Array.from(document.querySelectorAll('.episode-visual'),e=>e.getAttribute('data-visual-id')))===JSON.stringify(ids),ids,{timeout:15000});
                    for(const icon of await page.locator('.episode-visual img.v6-symbol').all())await icon.evaluate(async e=>{e.loading='eager';await e.decode()});
                    await page.locator('.scene-title').first().waitFor();
                    const expected=arts.filter(a=>a.episode===route.split('/').pop());
                    if((episode.id<'ep-0007'&&!expected.length)||await page.locator('figure.scene-art').count()!==expected.length)throw Error('Illustration coverage '+route);
                    for(const a of expected){
                      const figure=page.locator('figure[data-art-id="'+a.id+'"]');
                      if(await figure.count()!==1)throw Error('Missing or duplicate '+a.id);
                      const img=figure.locator('img');await img.scrollIntoViewIfNeeded();await img.evaluate(e=>e.decode());
                      const actual=await img.evaluate(e=>({w:e.naturalWidth,h:e.naturalHeight,fit:e.getBoundingClientRect().width<=e.closest('figure').getBoundingClientRect().width+1}));
                      if(actual.w!==a.width||actual.h!==a.height||!actual.fit)throw Error('Image size/overflow '+a.id);
                      if(!(await figure.innerText()).includes(a.label)||await figure.locator('a').getAttribute('href')!==a.sourceUrl)throw Error('Attribution '+a.id);
                      const prev=await figure.evaluate(e=>{let p=e.previousElementSibling;while(p?.matches('figure.scene-art'))p=p.previousElementSibling;return {tag:p?.tagName,text:p?.textContent||''}});
                      if(prev.tag!==(a.placement==='heading'?'H2':'BLOCKQUOTE')||!prev.text.includes(a.anchor))throw Error('Wrong placement '+a.id);
                    }
                    if((await page.locator('.story-content').innerText()).match(/EVD-|Evidence registry|Mốc đọc và nhân vật/))throw Error('Reader metadata '+route);if(await page.locator('.episode-sources').count()!==1)throw Error('Missing consolidated sources '+route);console.log('PASS illustration coverage',engine.name(),width,route,expected.length);
                    if(route==='/read/ep-0002'){
                    await page.getByRole('button',{name:'Cỡ chữ',exact:true}).click();await page.getByRole('button',{name:'Tăng cỡ chữ'}).click();
                    if(!(await page.locator('.story-content').innerText()).includes('hỏa công'))throw Error('Missing Trường Xã narrative');await page.getByRole('button',{name:'Đóng cài đặt'}).click();}
                    if(route==='/read/ep-0006'){const img=page.locator('figure[data-art-id="VIS-B02-012"] img');await img.scrollIntoViewIfNeeded();await img.evaluate(e=>e.decode());}
                  }
                  if(route==='/people'){
                    await page.goto(base+'#/people');
                    await page.locator('.people-grid button').filter({has:page.locator('.portrait-frame[data-person-name="Đổng Trác"]')}).click();
                    const radarSheet=page.locator('dialog[open]');
                    const radar=radarSheet.locator('.character-radar');
                    await radar.waitFor();
                    const before=await radar.locator('svg').getAttribute('aria-label');
                    await radar.getByRole('button',{name:'189',exact:true}).click();
                    const after=await radar.locator('svg').getAttribute('aria-label');
                    if(before===after||!after.includes('Quyền lực 5'))throw Error('Radar timeline did not change');
                    await radar.locator('summary').click();
                    await radar.locator('.radar-explain dd').first().waitFor();if((await radar.innerText()).includes('EVD-'))throw Error('Radar internal ID leaked');
                    if(!await radarSheet.evaluate(el=>el.scrollWidth<=el.clientWidth+1))throw Error('Radar sheet overflow');
                    await radarSheet.getByRole('button',{name:'Đóng'}).click();
                    await page.locator('.people-grid button').filter({has:page.locator('.portrait-frame[data-person-name="Tào Hồng"]')}).click();
                    if(await radarSheet.locator('.character-radar svg circle').count()!==6)throw Error('Missing Cao Hong radar axes');
                    await radarSheet.getByRole('button',{name:'Đóng'}).click();
                    console.log('PASS radar timeline, source evidence, Cao Hong coverage and overflow');
                    await page.locator('.people-grid button').filter({has:page.locator('.portrait-frame[data-person-name="Tào Tháo"]')}).click();
                    const quoteSheet=page.locator('dialog[open]');
                    const quoteCards=quoteSheet.locator('.character-quote');
                    if(await quoteCards.count()!==5)throw Error('Missing Cao Cao quotes');
                    if(await quoteSheet.locator('.character-radar').count()!==1)throw Error('Radar and quote integration missing');
                    const labels=await quoteCards.locator('.quote-layer').allTextContents();
                    if(JSON.stringify(labels)!==JSON.stringify(['[Bùi chú]','[Tiểu thuyết]','[Chính sử]','[Chính sử]','[Chính sử]']))throw Error('Quote provenance '+JSON.stringify(labels));
                    await quoteCards.first().locator('summary').click();
                    await quoteCards.first().locator('[lang="zh-Hant"]').waitFor({state:'visible'});
                    if(!await quoteCards.first().locator('.quote-source a').getAttribute('href'))throw Error('Missing quote source');
                    await quoteSheet.locator('.character-radar').getByRole('button',{name:'190',exact:true}).click();
                    if(await quoteCards.count()!==5)throw Error('Quotes lost on radar switch');
                    if(!await quoteSheet.evaluate(el=>el.scrollWidth<=el.clientWidth+1))throw Error('Wiki sheet overflow');
                    await quoteSheet.getByRole('button',{name:'Đóng'}).click();
                    await page.locator('.people-grid button').filter({has:page.locator('.portrait-frame[data-person-name="Hán Linh Đế"]')}).click();
                    if(await quoteSheet.locator('.character-quotes').count())throw Error('Empty quote section');
                    await quoteSheet.getByRole('button',{name:'Đóng'}).click();
                    console.log('PASS combined Wiki quotes, provenance, disclosure, radar switch and empty state');
                    while(await page.locator('.wiki-more').count())await page.locator('.wiki-more').click();const wikiCards=page.locator('.people-grid button');
                    const wikiCount=await wikiCards.count();
                    if(wikiCount!==121)throw Error('Missing Wiki profiles');
                    let snapshotCount=0;
                    for(let personIndex=0;personIndex<wikiCount;personIndex++){
                    await wikiCards.nth(personIndex).click();
                    const fullRadar=page.locator('dialog[open] .character-radar');
                    await fullRadar.waitFor();
                    const select=fullRadar.locator('select');
                    const options=await select.locator('option').count();
                    if(options<1)throw Error('Missing radar snapshot '+personIndex);
                    for(let snapshotIndex=0;snapshotIndex<options;snapshotIndex++){
                    await select.selectOption(String(snapshotIndex));
                    if(await fullRadar.locator('svg circle').count()!==6||await fullRadar.locator('svg polygon[fill="#a18453"]').count()!==1)throw Error('Incomplete radar '+personIndex+' '+snapshotIndex);
                    const scores=await fullRadar.locator('svg text').allTextContents();
                    if(scores.filter(v=>['1/5','2/5','3/5','4/5','5/5'].includes(v.replace('*',''))).length!==6)throw Error('Missing visible score '+scores.join(','));
                    snapshotCount++;
                    }
                    await page.locator('dialog[open]').getByRole('button',{name:'Đóng'}).click();
                    }
                    if(snapshotCount!==230)throw Error('Missing Wiki snapshots '+snapshotCount);
                    console.log('PASS all Wiki radar snapshots',wikiCount,snapshotCount);
                    const img=page.locator('.people-grid img.historical-portrait').first();await img.scrollIntoViewIfNeeded();await img.evaluate(e=>e.decode());
                    await page.getByRole('button',{name:'Thưởng lãm cuộn chân dung'}).click();await page.locator('.portrait-scroll button').first().click();await page.getByRole('button',{name:'Phóng to'}).click();await page.getByRole('button',{name:'Đóng'}).click();
                  }
                  if(route.startsWith('/atlas')){
                    await page.locator('.leaflet-container').waitFor();await page.locator('.atlas-person-marker').first().waitFor();
                    if(route==='/atlas/184'){await page.locator('#atlas-pilot-year').selectOption('189');await page.locator('section[data-atlas-year="189"] .strategy-board').waitFor();}
                  }
                  if(!await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1))throw Error('Live overflow '+width+' '+route);
                }
                if(errors.length)throw Error(errors.join('\n'));
                console.log('PASS live',engine.name(),width,height);await page.close();
              }
            }finally{await browser.close()}
          }
          JS
          TQC_TEST_BASE="https://sali5610.github.io/tam-quoc-chi/?release=${GITHUB_SHA}" node scripts/batch-03-atlas-smoke.mjs
