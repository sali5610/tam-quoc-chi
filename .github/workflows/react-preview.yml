name: Publish isolated React preview
# Release: character and relationship layers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/react-preview.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('dist/atlas/atlas.json'));if(d.license!=='CC-BY-SA-4.0'||d.version!==2||d.regions.length!==80||!d.events.length)throw Error('Atlas validation failed')"
          rm -rf docs/react-preview
          mkdir -p docs/react-preview
          cp -a dist/. docs/react-preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
