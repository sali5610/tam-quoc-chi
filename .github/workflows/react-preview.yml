name: Publish isolated React preview
# Release: PO-approved Wiki quotes + radar; retain Hybrid v4 and Batch-02 QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/react-preview.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install image build dependency
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends imagemagick
          fi
          convert -version
      - run: npm run build
      - run: |
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('dist/atlas/atlas.json'));if(d.license!=='CC-BY-SA-4.0'||d.version!==2||d.regions.length!==80||!d.events.length)throw Error('Atlas validation failed')"
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import {resolveAtlasPlace} from './src/atlas-location.ts';
          const pilot=JSON.parse(fs.readFileSync('content/atlas/pilot.json','utf8'));
          const atlas=JSON.parse(fs.readFileSync('dist/atlas/atlas.json','utf8'));
          for(const year of [168,184,189,190,191,192]){
            const events=pilot.events.filter(e=>Number(e.year)===year);
            if(events.length!==1)throw Error('Unexpected pilot event count for '+year);
            for(const e of events){
              const p=pilot.places.find(p=>p.id===e.place);
              const city=resolveAtlasPlace(atlas,p);
              if(!city||!Array.isArray(city.p)||!city.p.every(Number.isFinite))throw Error('Unresolved pilot coordinates '+e.id);
              for(const id of e.people)if(!pilot.people.some(p=>p.id===id)||!e.roles[id])throw Error('Missing person or role '+id);
              console.log('PASS input',e.id,city.name,city.p,city.precision,e.people);
            }
          }
          const registry=JSON.parse(fs.readFileSync('content/atlas/portraits.json','utf8'));
          const enabled=registry.portraits.filter(p=>p.enabled);
          if(enabled.length!==8||new Set(enabled.map(p=>p.id)).size!==enabled.length)throw Error('Unexpected portrait coverage');
          for(const p of enabled){if(!pilot.people.some(x=>x.id===p.id)||!fs.existsSync('dist/'+p.path))throw Error('Missing portrait '+p.id);}
          if(pilot.trajectories.length!==2)throw Error('Missing pilot journeys');
          for(const t of pilot.trajectories){
            if(!pilot.people.some(p=>p.id===t.person))throw Error('Unknown journey person '+t.id);
            for(const s of t.stops){const place=pilot.places.find(p=>p.id===s.place);if(!place||!s.evidence||!s.sourceUrl||!Number.isInteger(s.order))throw Error('Invalid journey stop '+s.place);const loc=resolveAtlasPlace(atlas,place);console.log('JOURNEY',t.id,s.order,s.place,loc?.precision||'unresolved');}
          }
          const html=fs.readFileSync('dist/index.html','utf8');
          const asset=html.match(/src="([^"]+\.js)"/)?.[1];
          if(!asset)throw Error('Missing built asset');
          const bundle=fs.readFileSync('dist/'+asset.replace(/^\.\//,''),'utf8');
          if(!bundle.includes('Atlas characters')||!bundle.includes('atlas-journey-select'))throw Error('Built asset missing character or journey renderer');
          JS
          rm -rf docs/react-preview
          mkdir -p docs/react-preview
          cp -a dist/. docs/react-preview/
          printf '%s\n' "$GITHUB_SHA" > docs/react-preview/release-sha.txt
      - name: Browser smoke test before deployment
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory . > /tmp/atlas-server.log 2>&1 &
          mkdir -p tam-quoc-chi
          ln -s ../docs/react-preview tam-quoc-chi/react-preview
          node scripts/browser-smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public SHA
        run: |
          BASE=https://sali5610.github.io/tam-quoc-chi/react-preview/
          for attempt in $(seq 1 18); do
            actual=$(curl -fsSL --max-time 10 "${BASE}release-sha.txt?sha=${GITHUB_SHA}&attempt=${attempt}" || true)
            if [ "$actual" = "$GITHUB_SHA" ]; then echo "PASS public SHA $actual"; exit 0; fi
            sleep 5
          done
          echo "FAIL public release SHA: $actual"; exit 1
      - name: Live Chromium and WebKit smoke
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          import fs from 'node:fs';
          const arts=JSON.parse(fs.readFileSync('content/scene-art.json','utf8'));
          const base='https://sali5610.github.io/tam-quoc-chi/react-preview/?release='+process.env.GITHUB_SHA;
          for(const engine of [chromium,webkit]){
            const browser=await engine.launch();
            try{
              for(const [width,height] of [[390,844],[834,1194],[1194,834]]){
                const page=await browser.newPage({viewport:{width,height},hasTouch:true,reducedMotion:'reduce'});
                const errors=[];page.on('pageerror',e=>errors.push(String(e)));
                await page.goto(base+'#/');await page.locator('.home-hero').waitFor();
                for(const route of ['/library','/read/ep-0001','/read/ep-0002','/read/ep-0003','/read/ep-0004','/read/ep-0005','/read/ep-0006','/people','/atlas/184','/atlas/190','/atlas/191','/atlas/192','/collection']){
                  await page.goto(base+'#'+route);await page.locator('main h1').first().waitFor();
                  if(route.startsWith('/read')){
                    await page.locator('.scene-title').first().waitFor();
                    const expected=arts.filter(a=>a.episode===route.split('/').pop());
                    if(!expected.length||await page.locator('figure.scene-art').count()!==expected.length)throw Error('Illustration coverage '+route);
                    for(const a of expected){
                      const figure=page.locator('figure[data-art-id="'+a.id+'"]');
                      if(await figure.count()!==1)throw Error('Missing or duplicate '+a.id);
                      const img=figure.locator('img');await img.scrollIntoViewIfNeeded();await img.evaluate(e=>e.decode());
                      const actual=await img.evaluate(e=>({w:e.naturalWidth,h:e.naturalHeight,fit:e.getBoundingClientRect().width<=e.closest('figure').getBoundingClientRect().width+1}));
                      if(actual.w!==a.width||actual.h!==a.height||!actual.fit)throw Error('Image size/overflow '+a.id);
                      if(!(await figure.innerText()).includes(a.label)||await figure.locator('a').getAttribute('href')!==a.sourceUrl)throw Error('Attribution '+a.id);
                      const prev=await figure.evaluate(e=>{let p=e.previousElementSibling;while(p?.matches('figure.scene-art'))p=p.previousElementSibling;return {tag:p?.tagName,text:p?.textContent||''}});
                      if(prev.tag!==(a.placement==='heading'?'H2':'BLOCKQUOTE')||!prev.text.includes(a.anchor))throw Error('Wrong placement '+a.id);
                    }
                    console.log('PASS illustration coverage',engine.name(),width,route,expected.length);
                    if(route==='/read/ep-0002'){
                    await page.getByRole('button',{name:'Tăng cỡ chữ'}).click();
                    await page.getByRole('button',{name:'Vén màn sử liệu'}).click();await page.locator('.ink-reveal-content').waitFor();
                    await page.getByRole('button',{name:'Khép màn'}).click();}
                    if(route==='/read/ep-0006'){const img=page.locator('figure[data-art-id="VIS-B02-012"] img');await img.scrollIntoViewIfNeeded();await img.evaluate(e=>e.decode());}
                  }
                  if(route==='/people'){
                    await page.goto(base+'#/people');
                    await page.locator('.people-grid button').filter({has:page.locator('.portrait-frame[data-person-name="Đổng Trác"]')}).click();
                    const radarSheet=page.locator('dialog[open]');
                    const radar=radarSheet.locator('.character-radar');
                    await radar.waitFor();
                    const before=await radar.locator('svg').getAttribute('aria-label');
                    await radar.getByRole('button',{name:'189',exact:true}).click();
                    const after=await radar.locator('svg').getAttribute('aria-label');
                    if(before===after||!after.includes('Quyền lực 5'))throw Error('Radar timeline did not change');
                    await radar.locator('summary').click();
                    await radar.getByText('EVD-0006',{exact:true}).first().waitFor();
                    if(!await radarSheet.evaluate(el=>el.scrollWidth<=el.clientWidth+1))throw Error('Radar sheet overflow');
                    await radarSheet.getByRole('button',{name:'Đóng ×'}).click();
                    await page.locator('.people-grid button').filter({has:page.locator('.portrait-frame[data-person-name="Tào Hồng"]')}).click();
                    if(await radarSheet.locator('.character-radar').count())throw Error('Empty radar rendered');
                    await radarSheet.getByRole('button',{name:'Đóng ×'}).click();
                    console.log('PASS radar timeline, source evidence, empty state and overflow');
                    await page.locator('.people-grid button').filter({has:page.locator('.portrait-frame[data-person-name="Tào Tháo"]')}).click();
                    const quoteSheet=page.locator('dialog[open]');
                    const quoteCards=quoteSheet.locator('.character-quote');
                    if(await quoteCards.count()!==3)throw Error('Missing Cao Cao quotes');
                    if(await quoteSheet.locator('.character-radar').count()!==1)throw Error('Radar and quote integration missing');
                    const labels=await quoteCards.locator('.quote-layer').allTextContents();
                    if(JSON.stringify(labels)!==JSON.stringify(['[Bùi chú]','[Tiểu thuyết]','[Chính sử]']))throw Error('Quote provenance '+JSON.stringify(labels));
                    await quoteCards.first().locator('summary').click();
                    await quoteCards.first().locator('[lang="zh-Hant"]').waitFor({state:'visible'});
                    if(!await quoteCards.first().locator('.quote-source a').getAttribute('href'))throw Error('Missing quote source');
                    await quoteSheet.locator('.character-radar').getByRole('button',{name:'190',exact:true}).click();
                    if(await quoteCards.count()!==3)throw Error('Quotes lost on radar switch');
                    if(!await quoteSheet.evaluate(el=>el.scrollWidth<=el.clientWidth+1))throw Error('Wiki sheet overflow');
                    await quoteSheet.getByRole('button',{name:'Đóng ×'}).click();
                    await page.locator('.people-grid button').filter({has:page.locator('.portrait-frame[data-person-name="Hán Linh Đế"]')}).click();
                    if(await quoteSheet.locator('.character-quotes').count())throw Error('Empty quote section');
                    await quoteSheet.getByRole('button',{name:'Đóng ×'}).click();
                    console.log('PASS combined Wiki quotes, provenance, disclosure, radar switch and empty state');
                    const img=page.locator('.people-grid img.historical-portrait').first();await img.scrollIntoViewIfNeeded();await img.evaluate(e=>e.decode());
                    await page.getByRole('button',{name:'Thưởng lãm cuộn chân dung'}).click();await page.locator('.portrait-scroll button').first().click();await page.getByRole('button',{name:'Phóng to'}).click();await page.getByRole('button',{name:'Đóng ×'}).click();
                  }
                  if(route.startsWith('/atlas')){
                    await page.locator('.leaflet-container').waitFor();await page.locator('.atlas-person-marker').first().waitFor();
                    if(route==='/atlas/184'){await page.locator('.atlas-anchor a').filter({hasText:'189'}).click();await page.locator('section[data-atlas-year="189"] .strategy-board').waitFor();}
                  }
                  if(!await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1))throw Error('Live overflow '+width+' '+route);
                }
                if(errors.length)throw Error(errors.join('\n'));
                console.log('PASS live',engine.name(),width,height);await page.close();
              }
            }finally{await browser.close()}
          }
          JS
